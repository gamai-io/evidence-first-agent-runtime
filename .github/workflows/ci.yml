name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repro:
    name: repro (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run the full offline repro
        run: |
          chmod +x repro.sh
          ./repro.sh
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repro-python-${{ matrix.python-version }}
          path: |
            agent-immunity/eval_results.json
            /tmp/proofgate_demo.json
          if-no-files-found: ignore

  package:
    name: package + MCP selftest
    runs-on: ubuntu-latest
    needs: repro
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Editable install
        run: python -m pip install -e .
      - name: Import and demo
        run: python -c "import gamai_trust; r=gamai_trust.demo(); assert r['proofgate']['counts']=={'confirmed':10,'refuted':2,'unverified':0}; print('package demo ok')"
      - name: MCP selftest
        run: python -m gamai_trust.mcp_server --selftest

  heldout:
    name: held-out benchmark (smoke)
    runs-on: ubuntu-latest
    needs: repro
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run 40 held-out attacks + benign controls
        run: python bench/run_heldout.py --limit 40 --out /tmp/heldout.json
      - name: Upload held-out report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heldout-report
          path: /tmp/heldout.json
          if-no-files-found: ignore
