name: vendored drift

# Fails if a component is copied back into this tree, or if a pin drifts
# (requirements-vendored.txt vs pyproject.toml, or the installed commit).
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  drift:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      # Installing the pins proves each commit still resolves upstream and lets
      # the check compare the installed commit with the pinned one.
      - name: Install the pinned packages
        run: python -m pip install -r requirements-vendored.txt
      - name: Check for copies and pin drift
        run: python3 tools/check_vendored.py
