[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "effect-broker"
version = "0.1.0"
description = "Policy gate before an agent acts, commit token after the effect is probed in the system-of-record."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "gamAI" }]

[project.scripts]
effect-broker = "effectbroker.cli:main"

[tool.setuptools.packages.find]
include = ["effectbroker*"]
