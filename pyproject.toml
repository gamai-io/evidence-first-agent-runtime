[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-first-agent-runtime"
version = "0.4.0"
description = "Umbrella reproduction harness for the gamAI trust components. Depends on the canonical packages instead of copying them."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "gamAI" }]
keywords = ["ai-agents", "trust", "verification", "prompt-injection", "mcp"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Security",
]
# Pinned to the commits this harness was verified against (2026-11-26).
# Keep in sync with requirements-vendored.txt.
dependencies = [
  "proofgate-runtime @ git+https://github.com/gamai-io/proofgate-runtime@6ad4e0b1e807cfe47bda1e892b022d3db05a0bde",
  "gamai-trust @ git+https://github.com/gamai-io/gamai-trust@936a2cb505bceb5308b2ccba85204aeba72353af",
  "gamai-guard @ git+https://github.com/gamai-io/gamai-guard@1fa20420eb3ec5e957d88d1f7f5a689cc8dc59a9",
]

[project.urls]
Homepage = "https://gamai.io"
Source = "https://github.com/gamai-io/evidence-first-agent-runtime"

# This repository is a harness, not a distribution: it installs the canonical
# packages above and ships no Python package of its own.
[tool.setuptools]
packages = []

[tool.pytest.ini_options]
# effect-broker is a self-contained package; repro.sh and CI test it from its
# own directory, this puts it on the path when pytest is run from the root.
pythonpath = ["effect-broker"]
